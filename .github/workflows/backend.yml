name: Backend - CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_BACKEND_REPO }}:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_BACKEND_REPO }}:latest \
            .

      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_BACKEND_REPO }}:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_BACKEND_REPO }}:latest

      - name: Get backend instance ID
        id: get-instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ secrets.BACKEND_INSTANCE_NAME }}" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ]; then
            echo "❌ Error: Could not find running backend instance with tag ${{ secrets.BACKEND_INSTANCE_NAME }}"
            exit 1
          fi
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

      - name: Deploy to backend EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.get-instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Backend (Stateless - No .env on disk)" \
            --parameters commands='[
              "APP_DIR=/home/ec2-user/invento_Backend",
              "if [ ! -d \"$APP_DIR/.git\" ]; then mkdir -p \"$APP_DIR\" && git clone https://github.com/${{ github.repository }}.git \"$APP_DIR\"; else cd \"$APP_DIR\" && git fetch origin && git reset --hard origin/main; fi",
              "cd \"$APP_DIR\"",
              "rm -f .env /home/ec2-user/.env",
              "if ! docker ps --format \"{{.Names}}\" | grep -q \"^invento-redis$\"; then docker run -d --name invento-redis --restart unless-stopped -p 6379:6379 redis:7-alpine redis-server --appendonly yes; fi",
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}",
              "docker pull ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_BACKEND_REPO }}:latest",
              "docker run --rm --network host -e ENVIRONMENT=production -e DATABASE_URL=\"${{ secrets.DATABASE_URL }}\" ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_BACKEND_REPO }}:latest alembic upgrade head || true",
              "docker stop invento-backend 2>/dev/null || true",
              "docker rm invento-backend 2>/dev/null || true",
              "docker run -d --name invento-backend --restart unless-stopped --network host -e ENVIRONMENT=production -e DATABASE_URL=\"${{ secrets.DATABASE_URL }}\" -e REDIS_URL=\"${{ secrets.REDIS_URL }}\" -e SECRET_KEY=\"${{ secrets.SECRET_KEY }}\" -e INTERNAL_API_KEY=\"${{ secrets.INTERNAL_API_KEY }}\" -e FIRST_ADMIN_PASSWORD=\"${{ secrets.FIRST_ADMIN_PASSWORD || 'InovoAdmin@2026!Secure' }}\" -e FIRST_ADMIN_EMAIL=\"${{ secrets.FIRST_ADMIN_EMAIL || 'admin@inovo.com' }}\" -e S3_BUCKET_NAME=\"${{ secrets.S3_BUCKET_NAME }}\" -e AWS_S3_REGION=\"${{ secrets.AWS_REGION }}\" -e MEDIA_PUBLIC_URL=\"http://${{ secrets.ALB_DNS_NAME }}/media/\" ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_BACKEND_REPO }}:latest"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command sent. Command ID: $COMMAND_ID"
          echo "Waiting for deployment to complete..."
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ steps.get-instance.outputs.instance_id }}"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ steps.get-instance.outputs.instance_id }}" --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" --output json
