name: Backend - CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_BACKEND_REPO }}:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_BACKEND_REPO }}:latest \
            .

      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_BACKEND_REPO }}:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_BACKEND_REPO }}:latest

      - name: Get backend instance ID
        id: get-instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ secrets.BACKEND_INSTANCE_NAME }}" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ]; then
            echo "❌ Error: Could not find running backend instance with tag ${{ secrets.BACKEND_INSTANCE_NAME }}"
            exit 1
          fi
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

      - name: Deploy to backend EC2 via SSM
        env:
          INSTANCE_ID: ${{ steps.get-instance.outputs.instance_id }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: ${{ secrets.ECR_BACKEND_REPO }}
          REGION: ${{ secrets.AWS_REGION }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          INTERNAL_KEY: ${{ secrets.INTERNAL_API_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Backend to $INSTANCE_ID" \
            --parameters commands="[
              \"APP_DIR=/home/ec2-user/invento_Backend\",
              \"if [ ! -d \\\"\\\$APP_DIR/.git\\\" ]; then mkdir -p \\\"\\\$APP_DIR\\\" && (git clone https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPO.git \\\"\\\$APP_DIR\\\" || git clone https://github.com/$GITHUB_REPO.git \\\"\\\$APP_DIR\\\"); else cd \\\"\\\$APP_DIR\\\" && git fetch origin && git reset --hard origin/main; fi\",
              \"cd \\\"\\\$APP_DIR\\\"\",
              \"cat << 'EOF' > .env\nENVIRONMENT=production\nDATABASE_URL=$DB_URL\nREDIS_URL=$REDIS_URL\nSECRET_KEY=$SECRET_KEY\nINTERNAL_API_KEY=$INTERNAL_KEY\nS3_BUCKET_NAME=$S3_BUCKET\nAWS_S3_REGION=$REGION\nEOF\",
              \"if ! docker ps --format '{{.Names}}' | grep -q '^invento-redis$'; then docker run -d --name invento-redis --restart unless-stopped -p 6379:6379 redis:7-alpine redis-server --appendonly yes; fi\",
              \"aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $REGISTRY\",
              \"docker pull $REGISTRY/$REPO:latest\",
              \"docker run --rm --network host --env-file .env $REGISTRY/$REPO:latest alembic upgrade head || true\",
              \"docker stop invento-backend 2>/dev/null || true\",
              \"docker rm invento-backend 2>/dev/null || true\",
              \"docker run -d --name invento-backend --restart unless-stopped --network host --env-file .env $REGISTRY/$REPO:latest\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command sent. Command ID: $COMMAND_ID"
          echo "Waiting for deployment to complete..."
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
